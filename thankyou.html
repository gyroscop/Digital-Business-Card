<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Business Card</title>
		<link rel="stylesheet" href="style.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="card">
			<header>
				<div class="image">
					<h1 style="font-size: 50px">Thank You!</h1>
				</div>

				<br />
			</header>
			<main>
				<p>
					Your support means the world to me! I love sharing my knowledge and
					creativity. Check out my YouTube channel for more amazing content!
				</p>
				<iframe
					width="560"
					height="315"
					src="https://www.youtube.com/embed/NJQ1lemH5Vg?si=WNK0rxABAiX1GXGC"
					title="YouTube video player"
					frameborder="0"
					allow="
						accelerometer;
						autoplay;
						clipboard-write;
						encrypted-media;
						gyroscope;
						picture-in-picture;
						web-share;
					"
					referrerpolicy="strict-origin-when-cross-origin"
					allowfullscreen
				></iframe>
			</main>
			<hr />
			<footer>
				<h2>Stay Connected !</h2>
				<p>Follow along for more exciting projects and updates</p>
				<div class="socialmedia">
					<a href=""><img src="./assets/facebook.png" alt="facebook" /></a>
					<a href=""> <img src="./assets/instagram.png" alt="instagram" /></a>
					<a href=""><img src="./assets/linkedin.png" alt="Linkedin" /></a>
				</div>
			</footer>
		</div>
	</body>
</html>
